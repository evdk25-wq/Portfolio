  <div class="contact-box">
    
    <div class="container-left">
      <h3>Formulaire de contact* </h3>
      
      <form id="contactForm" onsubmit="return validateForm();">
        <div class="input-row">
          <div class="input-group">
            <label>Nom*</label>
            <input type="text" id="name" placeholder="Entrez votre nom" required />
          </div>

          <div class="input-group">
            <label>Téléphone*</label>
            <input type="text" id="phone" placeholder="+32411223344" required />
          </div>
        </div>

        
        <div class="input-row">
          <div class="input-group">
            <label>Email*</label>
            <input type="email" id="email" placeholder="votremail@gmail.com" required />
          </div>

          <div class="input-group">
            <label>Sujet</label>
            <input type="text" id="subject" placeholder="Concerne" />
          </div>
        </div>

        
        <label>Message*</label>
        <textarea rows="10" id="message" placeholder="Tapez votre message" required></textarea>
        <button type="submit">Envoyer!</button>
      </form>
    </div>
